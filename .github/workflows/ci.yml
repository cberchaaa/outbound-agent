name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: node --test test/*.test.js

  seed-in-sync:
    name: committed sequence matches its builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # data/sequence-template.json is generated, never hand-edited. If these
      # drift, the copy someone edited by hand would be silently overwritten the
      # next time anyone runs the builder.
      - name: Rebuild the sequence
        run: node tools/build-sequence.mjs
      - name: Fail if the committed file differs
        run: git diff --exit-code -- data/sequence-template.json

  cli-smoke:
    name: CLI runs on a clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node src/cli.js validate
      - run: node src/cli.js brief --date=2026-09-14
      - run: node src/cli.js drafts
